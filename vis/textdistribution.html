<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="lib/plotly-latest.min.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>


	function getQueryVariable(variable) {
		var query = window.location.search.substring(1);
		var vars = query.split("&");
		for (var i=0;i<vars.length;i++) {
			var pair = vars[i].split("=");
			if (pair[0] == variable) {
				return decodeURIComponent(pair[1]);
			}
		} 
		return ""
	}
	var snippet = getQueryVariable("snippet")
	var character = getQueryVariable("character")
	if(snippet.length>0){param ="&snippet="+snippet}else{param=""}
	if(character.length>0){param ="&character="+character}else{param=""}
	
	if(param.length>0){

		
		var watermark = function(){
			today = new Date();
			today = String(today.getDate()).padStart(2, '0') + '.' + String(today.getMonth() + 1).padStart(2, '0') + '.' + today.getFullYear();
			return [{
				xref:'paper',
				x:0,
				yref:'paper',
				y:1,
				xanchor:'left',
				yanchor:'bottom',
				'text': '<span style="color:gray;"> Source: '+window.location.hostname+window.location.pathname+'. Accessed ' +today+'</span>',
				showarrow: false
			}]
		}

		var urn = getQueryVariable("urn")
		var lc = getQueryVariable("lowercase")
		if(lc.length>0){lc ="&lowercase"}else{lc=""}

		textstr=""
		rawFile = new XMLHttpRequest();
		rawFile.open("GET", "../plain/textdistribution.php?urn="+urn+param+lc, false);
		rawFile.onreadystatechange = function (){
			if(rawFile.readyState === 4){
				if(rawFile.status === 200 || rawFile.status == 0)
				{textstr = rawFile.responseText;}
			}}
		rawFile.send(null);

		data_arr = textstr.trim().split("\n");

		date= []
		count = []
		sep = "\t"
		
		for (var i = 0; i < data_arr.length; i++) {
			line = data_arr[i];
			tmp = line.split(sep)
			date.push(tmp[0])
			count.push(parseInt(tmp[1]))
		}
		var data = [{
			x: date,
			y: count,
			mode: 'markers',
			marker: {
				color: "black",
				size:"4"
			}
		}];

		var layout = {
			hovermode:"closest",
			title:{
				text: urn + "<br>"+snippet,
			},
			xaxis: {
				showticklabels: false,
				title:"Document Continuation"
				},
			yaxis: {
				zeroline:false,
				title:"Absolute Token Count per Text Unit"
			},
			annotations:watermark()
		};
		myPlot = Plotly.newPlot('myDiv', data, layout);
	}
</script>
</body>
